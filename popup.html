<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px; padding: 16px; margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px; background: #0a0a0a; color: #d8d8d8;
    }
    h1  { font-size: 11px; letter-spacing: .2em; color: #ff7700; margin: 0 0 12px; }
    .logo { color: #ff7700; margin-right: 6px; }
    #msg { color: #888; font-size: 12px; margin-bottom: 10px; }
    #err { color: #ff4444; font-size: 11px; margin-top: 6px; display: none; }
    #btn-open {
      width: 100%; padding: 9px; margin-top: 2px;
      background: #111; border: 1px solid #ff7700;
      color: #ff7700; border-radius: 6px; font-size: 12px;
      cursor: not-allowed; opacity: 0.5;
      transition: background .15s, color .15s, opacity .15s;
    }
    #btn-open:not(:disabled):hover { background: #ff7700; color: #000; }
  </style>
</head>
<body>
  <h1><span class="logo">◉</span>BLACK HOLE</h1>
  <div id="msg">Ready.</div>
  <button id="btn-open" disabled>Open Side Panel</button>
  <div id="err"></div>
  <script src="popup.js"></script>
</body>
</html>
